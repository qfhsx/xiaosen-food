version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: xiaosen_mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: xiaosen123
      MYSQL_DATABASE: xiaosen_food
      MYSQL_USER: xiaosen
      MYSQL_PASSWORD: xiaosen123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - xiaosen_network

  backend:
    build: ./backend
    container_name: xiaosen_backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: xiaosen
      DB_PASSWORD: xiaosen123
      DB_NAME: xiaosen_food
      JWT_SECRET: xiaosen-secret-key-2024
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "8082:8080"
    depends_on:
      - mysql
    networks:
      - xiaosen_network

  frontend:
    build: ./frontend
    container_name: xiaosen_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - xiaosen_network

  admin:
    build: ./admin
    container_name: xiaosen_admin
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - xiaosen_network

volumes:
  mysql_data:

networks:
  xiaosen_network:
    driver: bridge